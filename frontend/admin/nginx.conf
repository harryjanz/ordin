# /catalog, /orders, /payments e /companies são ao mesmo tempo rotas de API
# (proxy pro gateway) e rotas de página do SPA (CatalogScreen, OrdersScreen,
# PaymentsScreen, CompanyListScreen/NewCompanyScreen/CompanyContractScreen) —
# uma navegação real de browser nesses paths (reload, link direto) precisa
# cair no index.html do React Router, não no backend. O sinal confiável é o
# Fetch Metadata: navegação de página chega com Sec-Fetch-Dest: document;
# chamada XHR/fetch do axios da própria SPA não. Mesma lógica do proxy do
# Vite em dev (vite.config.ts).
map $http_sec_fetch_dest $is_navigation {
    document 1;
    default  0;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Padrão do Nginx é 1MB — abaixo do limite de upload de imagem de
    # produto (2MB, ver catalog-service/main.py _IMAGE_MAX_BYTES) e bem
    # abaixo do limite de vídeo de modo espera do totem (500MB, ORD-115,
    # ver company-service/main.py _VIDEO_MAX_BYTES). Essa é a primeira
    # camada de Nginx que a requisição do browser atravessa (antes do
    # gateway), então precisa do mesmo ajuste do nginx.conf raiz.
    client_max_body_size 520m;

    location /auth/ {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /catalog {
        if ($is_navigation) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /orders {
        if ($is_navigation) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /tickets {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ORD-087: /users/complete-registration é só chamada de API (o SPA fica
    # em /set-password, um path diferente, já servido pelo catch-all abaixo)
    # — sem lógica de is_navigation, mesmo padrão de /auth e /tickets.
    location /users {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /payments {
        if ($is_navigation) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /companies {
        if ($is_navigation) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Upload de vídeo de até 500MB (ORD-115), mesmo racional do
        # nginx.conf raiz.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ORD-093: mesmo caso de /companies — /platform-users é rota de API
    # (proxy pro gateway) e rota de página do SPA (PlatformUsersScreen) ao
    # mesmo tempo.
    location /platform-users {
        if ($is_navigation) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ORD-119 — primeiro cliente WebSocket do admin (FulfillmentScreen).
    location /ws/ {
        proxy_pass http://nginx:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
