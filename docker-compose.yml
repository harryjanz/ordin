services:

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - ordin
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","root","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ordin

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ordin

  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ordin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ordin_dev}
    volumes:
      - mongo_data:/data/db
    networks:
      - ordin

  auth-service:
    build: ./services/auth
    restart: always
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DB_URL: ${AUTH_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      COMPANY_SERVICE_URL: ${COMPANY_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:3001}
    networks:
      - ordin
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  company-service:
    build: ./services/company
    restart: always
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      DB_URL: ${COMPANY_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
    networks:
      - ordin
    depends_on:
      mysql:
        condition: service_healthy

  catalog-service:
    build: ./services/catalog
    restart: always
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      DB_URL: ${CATALOG_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    networks:
      - ordin
    depends_on:
      mysql:
        condition: service_healthy

  order-service:
    build: ./services/order
    restart: always
    ports:
      - "8004:8004"
    env_file: .env
    environment:
      DB_URL: ${ORDER_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      QR_SECRET: ${QR_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    networks:
      - ordin
    depends_on:
      mysql:
        condition: service_healthy

  payment-service:
    build: ./services/payment
    restart: always
    ports:
      - "8005:8005"
    env_file: .env
    environment:
      DB_URL: ${PAYMENT_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      COMPANY_SERVICE_URL: ${COMPANY_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MESSAGE_BROKER: ${MESSAGE_BROKER}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MONGO_URL: ${MONGO_URL}
      MONGO_DB: ${MONGO_DB}
    networks:
      - ordin
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ordin
    depends_on:
      - auth-service
      - company-service
      - catalog-service
      - order-service
      - payment-service

  totem:
    build: ./frontend/totem
    restart: always
    ports:
      - "3000:80"
    networks:
      - ordin
    depends_on:
      - nginx

  admin:
    build: ./frontend/admin
    restart: always
    ports:
      - "3001:80"
    networks:
      - ordin
    depends_on:
      - nginx

  balcao:
    build: ./frontend/balcao
    restart: always
    ports:
      - "3002:80"
    networks:
      - ordin
    depends_on:
      - nginx

networks:
  ordin:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
