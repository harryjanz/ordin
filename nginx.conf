events { worker_connections 1024; }

http {
  upstream auth    { server auth-service:8001; }
  upstream company { server company-service:8002; }
  upstream catalog { server catalog-service:8003; }
  upstream order   { server order-service:8004; }
  upstream payment { server payment-service:8005; }

  server {
    listen 80;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;

    location /auth/     { proxy_pass http://auth/;   }
    location /companies { proxy_pass http://company; }
    location /catalog   { proxy_pass http://catalog; }
    location /orders    { proxy_pass http://order;   }
    location /tickets   { proxy_pass http://order;   }
    location /payments  { proxy_pass http://payment; }

    location /ws/ {
      proxy_pass http://order;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    location /health {
      return 200 '{"status":"ok","gateway":"foodkiosk"}';
      add_header Content-Type application/json;
    }
  }
}