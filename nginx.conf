events { worker_connections 1024; }

http {
  # Resolver DNS do Docker — resolve hostnames dinamicamente em vez de no startup
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 80;

    location ~ ^/internal/ {
      return 403 '{"detail":"Acesso interno não autorizado"}';
      add_header Content-Type application/json;
    }

    location /auth/ {
      set $upstream http://auth-service:8001;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /companies {
      set $upstream http://company-service:8002;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /catalog {
      set $upstream http://catalog-service:8003;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /orders {
      set $upstream http://order-service:8004;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /tickets {
      set $upstream http://order-service:8004;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /payments {
      set $upstream http://payment-service:8005;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
      set $upstream http://order-service:8004;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /health {
      return 200 '{"status":"ok","gateway":"ordin"}';
      add_header Content-Type application/json;
    }
  }
}
