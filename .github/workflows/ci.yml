name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar credenciais hardcoded
        run: |
          ! grep -rn \
            "auth_pass\|company_pass\|catalog_pass\|order_pass\|payment_pass\|dev-secret" \
            services/

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff mypy -r services/requirements.txt -r services/requirements-dev.txt

      - name: ruff
        run: ruff check services/

      - name: mypy (ORD-156 — medição, não bloqueia build ainda; ver docs/stories/ORD-156-debito-lint-services.md)
        # mypy services/ (uma chamada só) trava em "Duplicate module named" —
        # main.py/config.py/conftest.py/etc se repetem por serviço sem
        # isolamento de pacote. Roda um por serviço. continue-on-error:
        # débito real medido em 289 erros (majoritariamente Column[T] do
        # SQLAlchemy legado) — registrado como débito conhecido, não é meta
        # desta história zerar. Corrigir a invocação (deps reais + por
        # serviço) já destrava medir o número certo, que é o objetivo daqui.
        continue-on-error: true
        run: |
          for svc in auth company catalog order payment; do
            echo "== mypy services/$svc =="
            mypy "services/$svc" --ignore-missing-imports
          done

  test:
    name: Testes + cobertura
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: fk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptest_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r services/requirements.txt
          pip install -r services/requirements-dev.txt

      - name: Run tests
        env:
          DB_URL: mysql+aiomysql://root:test_root@localhost:3306/fk_test
          JWT_SECRET: test-secret-ci
          JWT_ACCESS_EXP_MINUTES: "60"
          JWT_REFRESH_EXP_DAYS: "7"
          INTERNAL_SECRET: test-internal-ci
          QR_SECRET: test-qr-secret-ci
          CORS_ORIGINS: http://localhost:3000
          REDIS_URL: redis://localhost:6379/0
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          MESSAGE_BROKER: sqs
          COMPANY_SERVICE_URL: http://localhost:8002
          ORDER_SERVICE_URL: http://localhost:8004
          PAYGO_BASE_URL: https://sandbox.controlpay.com.br/webapi/
        run: |
          pytest services/ \
            --cov=services \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -v

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build all services
        run: |
          for svc in auth company catalog order payment; do
            docker build -t ordin-$svc:ci ./services/$svc
          done
